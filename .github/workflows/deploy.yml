name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-main
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Angular app
        run: npm run build

      - name: Build Cloudflare Pages Functions
        run: >
          npx wrangler pages functions build functions
          --outdir dist/hp-suporte-remoto-client/browser
          --output-routes-path dist/hp-suporte-remoto-client/browser/_routes.json
          --compatibility-date 2025-05-19
          --compatibility-flags nodejs_compat

      # Aplica migrations pendentes ANTES do deploy do front, pra que o schema
      # esteja pronto quando o código novo for ao ar. Se uma migration falhar
      # (ex: pré-cheque da 0013 detectando duplicados), o deploy aborta e o
      # front antigo permanece no ar. Pra re-tentar depois de corrigir, dispare
      # o workflow manualmente via "Run workflow" (workflow_dispatch).
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply Supabase migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref qcrpgeeiiavgiunwyukj
          supabase migration list
          supabase db push

      - name: Deploy client to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist/hp-suporte-remoto-client/browser --project-name=hpsuporteremoto --branch=main
